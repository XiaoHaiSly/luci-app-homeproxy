config hiddify-core 'main'
	# the plugin drives the core through its own init script, keep the
	# standalone service disabled to avoid a second transparent-proxy instance
	option enabled '0'
	option conffile '/etc/hiddify-core/config.json'
	option workdir '/usr/share/hiddify-core'
	option log_stderr '1'
	# router: transparent proxy for the whole network; proxy: only the proxy ports
	option mode 'router'
